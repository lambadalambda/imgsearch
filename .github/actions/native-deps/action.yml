name: Native dependencies
description: >-
  Install the system packages, libvips 8.18 (Linux, cached), and the llama.cpp
  runtime libraries (cached on the submodule SHA) shared by CI and the rolling
  release.

inputs:
  extra-linux-packages:
    description: Additional apt packages to install on Linux (space separated).
    default: ""
  extra-macos-packages:
    description: Additional Homebrew packages to install on macOS (space separated).
    default: ""
  llama-cmake-args:
    description: Extra CMake arguments for the llama.cpp build (IMGSEARCH_LLAMA_CMAKE_ARGS).
    default: ""
  llama-build-jobs:
    description: Parallel build jobs for llama.cpp (IMGSEARCH_LLAMA_BUILD_JOBS); empty uses the CMake default.
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake curl meson ninja-build pkg-config \
          libexpat1-dev libglib2.0-dev libheif-dev libimagequant-dev libjpeg-dev libpng-dev libwebp-dev \
          ${{ inputs.extra-linux-packages }}

    - name: Restore libvips 8.18 build
      if: runner.os == 'Linux'
      id: vips-cache
      uses: actions/cache@v4
      with:
        path: /tmp/vips-stage
        key: vips-8.18.0-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Build libvips 8.18
      if: runner.os == 'Linux' && steps.vips-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://github.com/libvips/libvips/releases/download/v8.18.0/vips-8.18.0.tar.xz -o /tmp/vips-8.18.0.tar.xz
        tar -xf /tmp/vips-8.18.0.tar.xz -C /tmp
        meson setup /tmp/vips-8.18.0/build /tmp/vips-8.18.0 \
          --buildtype=release \
          --prefix=/usr/local \
          -Dintrospection=disabled \
          -Dmodules=disabled
        meson compile -C /tmp/vips-8.18.0/build
        DESTDIR=/tmp/vips-stage meson install -C /tmp/vips-8.18.0/build

    - name: Install libvips 8.18
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo cp -a /tmp/vips-stage/. /
        sudo ldconfig
        pkg-config --modversion vips

    - name: Install macOS packages
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install vips ${{ inputs.extra-macos-packages }}

    - name: Compute llama.cpp cache key
      id: llama-key
      shell: bash
      env:
        LLAMA_CMAKE_ARGS: ${{ inputs.llama-cmake-args }}
      run: |
        sha="$(git rev-parse HEAD:deps/llama.cpp)"
        args="$(printf '%s' "${LLAMA_CMAKE_ARGS}" | shasum -a 256 | cut -c1-12)"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        echo "args=${args}" >> "$GITHUB_OUTPUT"

    - name: Restore llama.cpp runtime libraries
      uses: actions/cache@v4
      with:
        path: deps/llama.cpp/build
        key: llama-${{ runner.os }}-${{ runner.arch }}-${{ steps.llama-key.outputs.sha }}-${{ steps.llama-key.outputs.args }}-${{ hashFiles('scripts/ensure_llama_cpp_native_build.sh') }}

    - name: Build llama.cpp runtime libraries
      shell: bash
      env:
        IMGSEARCH_LLAMA_CMAKE_ARGS: ${{ inputs.llama-cmake-args }}
        IMGSEARCH_LLAMA_BUILD_JOBS: ${{ inputs.llama-build-jobs }}
      run: |
        # Exits immediately when the restored build already matches.
        scripts/ensure_llama_cpp_native_build.sh
