name: Rolling Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-14
            target: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        uses: ./.github/actions/native-deps
        with:
          extra-linux-packages: patchelf
          llama-cmake-args: ${{ runner.os == 'Linux' && '-DGGML_NATIVE=OFF' || '' }}
          llama-build-jobs: ${{ runner.os == 'Linux' && '2' || '' }}

      - name: Download sqlite-vector
        run: scripts/setup_sqlite_vector.sh

      - name: Package release artifact
        run: scripts/package_release.sh "${{ matrix.target }}" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: rolling
          name: Rolling Release
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          # Archive names carry the commit SHA, so drop the previous
          # commit's artifacts instead of accumulating them.
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "dist/*.tar.gz,dist/*.sha256"
          body: |
            Automated rolling release from `${{ github.ref_name }}` at `${{ github.sha }}`.
            Archive names end with the short commit SHA; `./imgsearch -version` prints the same stamp.

            Included artifacts:
            - Linux x86_64 build
            - macOS arm64 build

            Notes:
            - The archives bundle `imgsearch`, the built Atelier frontend, llama.cpp shared libraries, and `sqlite-vector`.
            - Linux archives also bundle `libvips` and its non-glibc shared-library dependencies.
            - macOS archives still expect `libvips` to be installed on the target system.
            - On first run, the default 2B Qwen GGUF files download automatically if missing.
