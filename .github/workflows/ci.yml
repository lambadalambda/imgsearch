name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native dependencies
        uses: ./.github/actions/native-deps
        with:
          extra-linux-packages: ffmpeg
          extra-macos-packages: ffmpeg
          llama-build-jobs: ${{ runner.os == 'Linux' && '2' || '' }}

      - name: Run Go tests
        run: go test ./...
